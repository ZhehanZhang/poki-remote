# Poki, the iPhone app: setup, the Live Activity with approvals, the relay
# connection and the debug probe, in one app. Generated with XcodeGen in the ios-app workflow (run
# scripts/make-assets.sh first); there is no checked-in .xcodeproj. The runner (WebDriverAgent) is a
# second bundle, built by the ios-runner workflow; see dev/ios-core docs/single-bundle.md.
name: Poki
options:
  bundleIdPrefix: nz.zheha.poki
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PokiCore:
    path: ../ios/PokiCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEBUG_INFORMATION_FORMAT: dwarf
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Poki:
    type: application
    platform: iOS
    sources:
      - path: Poki
      - path: Shared
    info:
      path: Poki/Info.plist
      properties:
        CFBundleDisplayName: Poki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageName: Bear
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # While Poki is on, background location (with the blue location pill) keeps the app, and with it
        # the relay connection and the launcher, running; silent audio is the fallback. Poki never reads
        # or sends the location itself.
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: Poki keeps running in the background while it is on, so agents can reach this iPhone. Poki does not record or send your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: Poki keeps running in the background while it is on, so agents can reach this iPhone. Poki does not record or send your location.
        CFBundleURLTypes:
          - CFBundleURLName: nz.zheha.poki
            CFBundleURLSchemes: [poki]
        NSLocalNetworkUsageDescription: Poki connects to this iPhone's own developer services to pair with it and to run the automation.
        NSBonjourServices: [_remotepairing-pairable-host._tcp, _remotepairing-manual-pairing._tcp]
        LSApplicationQueriesSchemes: [surge, loon, shadowrocket, sing-box]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Poki/Poki.entitlements
      properties:
        com.apple.security.application-groups: [group.nz.zheha.poki]
    dependencies:
      - target: PokiWidgets
      - package: PokiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.zheha.poki
        # PokiLauncher: the Rust static library from native/launcher, built for aarch64-apple-ios
        # before this project (see .github/workflows/ios-app.yml).
        SWIFT_OBJC_BRIDGING_HEADER: Poki/Runtime/Poki-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../launcher/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../launcher/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../launcher/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: [-lpoki_launcher, -lc++, -framework, Security, -framework, SystemConfiguration]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PokiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokiTests]
    dependencies:
      - target: Poki
      - package: PokiCore
    settings:
      base:
        # @testable import Poki re-reads the app's bridging header, which includes the launcher's C header.
        HEADER_SEARCH_PATHS: $(SRCROOT)/../launcher/include
  PokiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PokiWidgets
      - path: Shared
    info:
      path: PokiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Poki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PokiWidgets/PokiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.nz.zheha.poki]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.zheha.poki.widgets

schemes:
  Poki:
    build:
      targets:
        Poki: all
        PokiWidgets: all
        PokiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PokiTests]
    archive:
      config: Release
